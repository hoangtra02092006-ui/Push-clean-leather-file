# Cấu hình build & deploy frontend PrintNest trên Netlify.
# Netlify chỉ host phần frontend tĩnh (không chạy được backend Java).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# CHU Y: biến khai trong [build.environment] của netlify.toml có quyền CAO HƠN biến đặt
# trong Netlify UI. Vì vậy ở đây KHÔNG khai VITE_USE_MOCK — khai vào là người dùng đặt
# biến trong UI bao nhiêu lần cũng vô hiệu, mà nhìn UI lại tưởng đã đặt xong.
#
# Chế độ demo giờ do src/api/client.ts tự suy ra: chưa khai VITE_API_BASE_URL thì tự bật
# demo, khai rồi thì dùng backend thật. Muốn ép bằng tay thì đặt VITE_USE_MOCK trong UI.
[build.environment]
  NODE_VERSION = "20"

# SPA fallback: mọi route trả về index.html để Vue Router xử lý.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
